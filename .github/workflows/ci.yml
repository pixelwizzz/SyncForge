name: SyncForge CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Lint & Test Suite
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: syncforge_user
          POSTGRES_PASSWORD: syncforge_pass
          POSTGRES_DB: syncforge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 🔍 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: 📦 Install Backend Dependencies
        run: npm ci
        working-directory: backend

      - name: 📝 Configure Local Environment
        run: cp .env.example .env
        working-directory: backend

      - name: 🔧 Inject CI Testing Credentials
        run: |
          echo "DATABASE_URL=postgresql://syncforge_user:syncforge_pass@localhost:5432/syncforge_test" >> .env
          echo "REDIS_URL=redis://localhost:6379" >> .env
          echo "REDIS_HOST=localhost" >> .env
          if [ ! -z "${{ secrets.CLERK_PUBLISHABLE_KEY }}" ]; then
            echo "CLERK_PUBLISHABLE_KEY=${{ secrets.CLERK_PUBLISHABLE_KEY }}" >> .env
          fi
          if [ ! -z "${{ secrets.CLERK_SECRET_KEY }}" ]; then
            echo "CLERK_SECRET_KEY=${{ secrets.CLERK_SECRET_KEY }}" >> .env
          fi
        working-directory: backend

      - name: 🚨 Run Eslint Audit
        run: npm run lint
        working-directory: backend

      - name: 🧪 Run Integration Tests
        run: npm run test:integration
        working-directory: backend
        env:
          NODE_ENV: test

  frontend:
    name: Frontend Quality Suite
    runs-on: ubuntu-latest

    steps:
      - name: 🔍 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Install Frontend Dependencies
        run: npm ci
        working-directory: frontend

      - name: 📝 Configure Local Environment
        run: cp .env.example .env
        working-directory: frontend

      - name: ⚡ Run TypeScript Compilation
        run: npx tsc --noEmit
        working-directory: frontend

      - name: 🧪 Build Verification
        run: npm run build
        working-directory: frontend
