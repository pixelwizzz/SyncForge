version: "3.9"

# Development overrides — run with:
# docker-compose -f docker-compose.yml -f docker-compose.dev.yml up

services:
  api:
    build:
      target: build
    container_name: syncforge-api-dev
    environment:
      - NODE_ENV=development
      - LOG_LEVEL=debug
    volumes:
      # Hot reload: mount source code
      - ./src:/app/src:ro
      - ./tests:/app/tests:ro
      - ./package.json:/app/package.json:ro
      # Persist local uploads and logs
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    command: npx nodemon src/server.js

  postgres:
    ports:
      - "5432:5432"

  redis:
    ports:
      - "6379:6379"
